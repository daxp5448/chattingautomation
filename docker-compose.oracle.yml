# Override for deploying alongside your other projects on the shared Oracle VM (see
# DEPLOYMENT_ORACLE.md). Run together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.oracle.yml up -d --build
#
# Does NOT replace docker-compose.yml -- local `docker compose up --build` (no override)
# keeps working exactly as documented in the README for anyone testing on their own
# machine.
#
# Port choices, confirmed against the live VM (see Deployment-context.txt):
#   3001 / 8001  -- already used by restaurant.kelviontech.in
#   3002         -- already used by jamanvar.kelviontech.in
#   5433         -- already used by restaurant's own Postgres
# This project takes the next free slot: 3003 (frontend) / 8002 (backend) / 5434
# (postgres) / 6380 (redis) / 9002+9003 (minio). RE-VERIFY before deploying --
# `sudo ss -ltnp | grep -E ':(3003|8002|5434|6380|9002|9003)\b'` should print nothing.
#
# backend/frontend publish on 0.0.0.0 (not 127.0.0.1) DELIBERATELY: the shared nginx
# container reaches every project through the Docker bridge gateway (172.17.0.1), which
# is a different interface than loopback -- a socket bound only to 127.0.0.1 is
# unreachable from that gateway address even though both are "the same host". This
# matches how restaurant/jamanvar already do it (see their own nginx vhosts, and
# jamanvar's .env comment). postgres/redis/minio stay loopback-only -- nothing outside
# this project's own containers (which reach them by Compose service name on their
# shared internal network) ever needs to reach them.

services:
  postgres:
    ports:
      - "127.0.0.1:5434:5432"

  redis:
    ports:
      - "127.0.0.1:6380:6379"

  minio:
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"

  backend:
    ports:
      - "8002:8000"

  frontend:
    build:
      args:
        # Baked into the JS bundle at build time (Next.js NEXT_PUBLIC_* vars are NOT
        # read at runtime) -- must be the real public URL, not localhost, or every
        # client-side call this env var drives (see frontend/.env.local.example: the
        # live-updates WebSocket bypasses the same-origin proxy on purpose) breaks
        # silently in production. Change the domain here if you picked something other
        # than whatsapp.kelviontech.in.
        NEXT_PUBLIC_API_BASE_URL: https://whatsapp.kelviontech.in/api/v1
    ports:
      - "3003:3000"
