# Host nginx vhost for the WhatsApp Business OS platform, following the exact pattern
# already used for restaurent.kelviontech.in on this same VM. Install with:
#
#   sudo cp nginx/whatsapp.kelviontech.in.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/whatsapp.kelviontech.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run BEFORE certbot (this is the plain-HTTP version certbot needs to see first to issue
# a certificate); certbot rewrites this file in place to add the HTTPS server block --
# see DEPLOYMENT_ORACLE.md's certbot step.
#
# Backend is FastAPI on 127.0.0.1:8002, frontend is Next.js on 127.0.0.1:3002 (see
# docker-compose.oracle.yml -- change these two upstream ports here to match if you had
# to remap them to avoid a collision with another project on the box).

server {
    listen 80;
    listen [::]:80;
    server_name whatsapp.kelviontech.in;

    client_max_body_size 20M;

    # Meta's webhook signs the raw request body (X-Hub-Signature-256, see
    # backend/app/api/v1/routers/webhook.py) -- nginx's default proxying passes the body
    # through untouched, nothing special needed here beyond a plain proxy_pass.
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live Orders/Dashboard WebSocket (JWT ticket passed as ?token=, see
    # frontend/lib/useLiveSocket.ts and backend/app/api/v1/routers/ws.py) -- needs the
    # Upgrade/Connection headers nginx doesn't add by default, so it gets its own
    # location block even though /api/v1/ws/ already matches the block above.
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8002/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Everything else (the dashboard UI, /signup, /login) -> Next.js. Next.js's own
    # rewrite (frontend/next.config.mjs) additionally proxies /api/* server-side to the
    # backend for the browser's same-origin cookie-based calls -- the /api/ block above
    # is what lets Meta's webhook and the direct WebSocket connection reach the backend
    # without going through that Next.js layer at all.
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
