# Host nginx vhost for the WhatsApp Business OS platform, mirroring the exact working
# structure of restaurant.kelviontech.in.conf already proven on this VM. Installed by
# `make nginx-install` AFTER `make ssl` has issued the certificate (see
# whatsapp.kelviontech.in.bootstrap.conf's docstring for why the two-phase split).
#
# Backend is FastAPI on host port 8002, frontend is Next.js on host port 3003 (see
# docker-compose.oracle.yml) -- both reached via the Docker bridge gateway 172.17.0.1
# since this vhost runs inside the shared kelviontech-nginx-1 CONTAINER, not on the host
# directly. Change these two upstream ports here to match if you had to remap them.

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name whatsapp.kelviontech.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whatsapp.kelviontech.in;

    ssl_certificate     /etc/letsencrypt/live/whatsapp.kelviontech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatsapp.kelviontech.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 20M;

    # Meta's webhook signs the raw request body (X-Hub-Signature-256, see
    # backend/app/api/v1/routers/webhook.py) -- plain proxy_pass leaves the body
    # untouched, nothing special needed here.
    location /api/ {
        proxy_pass http://172.17.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live Orders/Dashboard WebSocket (JWT ticket passed as ?token=, see
    # frontend/lib/useLiveSocket.ts and backend/app/api/v1/routers/ws.py) -- needs its
    # own location for the Upgrade/Connection headers even though /api/v1/ws/ already
    # matches the block above; nginx picks the longest matching prefix.
    location /api/v1/ws/ {
        proxy_pass http://172.17.0.1:8002/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Everything else (the dashboard UI, /signup, /login) -> Next.js. Next.js's own
    # rewrite (frontend/next.config.mjs) additionally proxies /api/* server-side for the
    # browser's same-origin cookie-based calls -- the /api/ block above is what lets
    # Meta's webhook and the direct WebSocket connection reach the backend without going
    # through that Next.js layer at all.
    location / {
        proxy_pass http://172.17.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
