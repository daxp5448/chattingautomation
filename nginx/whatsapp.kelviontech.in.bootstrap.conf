# TEMPORARY HTTP-only vhost -- installed by `make nginx-bootstrap` BEFORE a certificate
# exists. Deliberately has no ssl_certificate directive: nginx -t fails outright if you
# reference a cert file that isn't on disk yet, so this has to be a separate, simpler
# file rather than just the HTTP half of the real one. `make nginx-install` overwrites
# this with the full HTTP+HTTPS file (nginx/whatsapp.kelviontech.in.conf) once `make ssl`
# has actually issued the certificate. Same two-phase approach already proven for
# jamanvar.kelviontech.in on this VM.

server {
    listen 80;
    listen [::]:80;
    server_name whatsapp.kelviontech.in;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://172.17.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://172.17.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
